name: Prepare StarKeeper lint dependency lock
on:
  push:
    branches:
      - ci/starkeeper-v0.4-verification
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve TypeScript lint parser
        run: npm install --save-dev --save-exact --package-lock-only --ignore-scripts @typescript-eslint/parser@8.73.0
      - name: Show generated lockfile patch
        run: |
          echo STKEEPER_LOCK_PATCH_BEGIN
          git diff -- package.json package-lock.json
          echo STKEEPER_LOCK_PATCH_END
