name: Diagnose StarKeeper Pages publishing
on:
  push:
    branches: [ci/starkeeper-v0.4-verification]
permissions:
  contents: read
  checks: read
  deployments: read
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the failed deployment annotations and Pages branch policy
        run: |
          gh api repos/Naloam/StarKeeper/check-runs/137090414029/annotations --jq '.[] | {annotation_level, message}'
          gh api repos/Naloam/StarKeeper/environments/github-pages --jq '{deployment_branch_policy, protection_rules: [.protection_rules[] | .type]}' || true
          gh api repos/Naloam/StarKeeper/environments/github-pages/deployment-branch-policies --jq '{branch_patterns: [.branch_policies[].name]}' || true
          gh api repos/Naloam/StarKeeper/pages --jq '{html_url, build_type, status}' || true
