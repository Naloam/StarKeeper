name: Export StarKeeper compiler diagnostics
on:
  push:
    branches: [ci/starkeeper-v0.4-verification]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f33243df80ac4ac75579450fde2ad5f978499a0b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Capture TypeScript diagnostics and locked declarations
        run: |
          npx tsc --noEmit --pretty false > typecheck.log 2>&1 || true
          cat typecheck.log
          find node_modules -type f \( -name package.json -o -name '*.d.ts' -o -name '*.d.cts' -o -name '*.d.mts' \) -print0 | tar -czf declarations.tgz --null -T -
      - uses: actions/upload-artifact@v4
        with:
          name: starkeeper-typecheck-inputs
          path: |
            declarations.tgz
            typecheck.log
          retention-days: 1
