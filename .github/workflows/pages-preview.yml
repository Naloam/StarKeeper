name: Publish StarKeeper Pages preview

on:
  push:
    branches: [deploy/starkeeper-v0.4-pages]

permissions:
  contents: read

concurrency:
  group: starkeeper-pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build -- --mode pages
      - name: Verify project-path assets
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const html = readFileSync("dist/index.html", "utf8");
            if (!html.includes("src=\"/StarKeeper/assets/")) throw Error("Missing Pages asset prefix");
          '
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        id: pages
      - name: Verify preview publishing target
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$PAGES_HOST" != "naloam.github.io" ] || [ "$PAGES_PATH" != "/StarKeeper" ]; then
            echo "::error::Expected the StarKeeper project site on naloam.github.io."
            exit 1
          fi
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the published page
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: curl --fail --silent --show-error --retry 4 --retry-all-errors "$PAGES_URL" | grep -F '/StarKeeper/assets/'
