<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PWA Icon Generator</title>
</head>
<body>
    <canvas id="canvas192" width="192" height="192" style="display:none;"></canvas>
    <canvas id="canvas512" width="512" height="512" style="display:none;"></canvas>
    <script>
        function generateIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#6366f1');
            gradient.addColorStop(1, '#8b5cf6');
            
            // Rounded rectangle
            const radius = size / 5;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Star
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            const centerX = size / 2;
            const centerY = size * 0.35;
            const outerRadius = size * 0.15;
            const innerRadius = outerRadius * 0.4;
            
            for (let i = 0; i < 5; i++) {
                const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                const x = centerX + Math.cos(angle) * outerRadius;
                const y = centerY + Math.sin(angle) * outerRadius;
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                
                const innerAngle = angle + (2 * Math.PI) / 10;
                const ix = centerX + Math.cos(innerAngle) * innerRadius;
                const iy = centerY + Math.sin(innerAngle) * innerRadius;
                ctx.lineTo(ix, iy);
            }
            ctx.closePath();
            ctx.fill();
            
            // Letter K
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.35}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('K', centerX, size * 0.7);
        }
        
        generateIcon(document.getElementById('canvas192'), 192);
        generateIcon(document.getElementById('canvas512'), 512);
        
        // Download links
        document.body.innerHTML = '<h2>Right-click and save:</h2>';
        ['192', '512'].forEach(size => {
            const canvas = document.getElementById('canvas' + size);
            const link = document.createElement('a');
            link.download = `pwa-${size}x${size}.png`;
            link.href = canvas.toDataURL();
            link.textContent = `Download pwa-${size}x${size}.png`;
            link.style.display = 'block';
            link.style.margin = '10px';
            document.body.appendChild(link);
            document.body.appendChild(canvas);
            canvas.style.display = 'block';
            canvas.style.border = '1px solid #ccc';
        });
    </script>
</body>
</html>
